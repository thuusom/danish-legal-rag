# Documentation: docs/github-workflows.md
#
# Daily law currency check (Issue #25).
#
# Runs ingest.law_fetcher against retsinformation-api.dk on a schedule and
# auto-files (or auto-closes) GitHub Issues when an upstream law has drifted
# from our cached version. The job does NOT mutate the production index — it
# only writes its own ephemeral cache on the runner. Triggering an actual
# re-ingest is still a human decision.
#
# Auto-issue lifecycle
# --------------------
# 1. Fetcher writes law_cache/currency-report.json with one entry per source.
#    Status values come from fetch_one(): up-to-date, new, updated, fetch-failed.
# 2. For every entry with status=new or status=updated, we open (or update) a
#    GitHub Issue titled "Stale law: <law_code> — v<our> -> v<latest>" labeled
#    `stale-law,auto`.
# 3. For every existing open `stale-law,auto` issue whose law is now reported
#    up-to-date, we auto-close with a confirmation comment.
# 4. fetch-failed entries are intentionally left for the operator to investigate
#    (out of scope for this loop — Issue #25 acceptance criterion 5).
#
# Required labels (one-time setup):
#   gh label create stale-law --description "Upstream law version drift" --color B60205
#   gh label create auto --description "Auto-managed by GitHub Actions" --color BFD4F2
#
# These are created by the `ensure-labels` step on every run; the calls are
# idempotent (`--force` updates if they already exist).

name: Check law currency

on:
  schedule:
    # 06:00 UTC daily ≈ 07:00 Europe/Copenhagen (winter) / 08:00 (summer).
    # Acceptance criterion 1 from #25 asked for 07:00 CPH; UTC cron is fine here
    # — the exact minute doesn't matter, the next-day signal does.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Ensure auto-issue labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create stale-law \
            --description "Upstream law version drift" \
            --color B60205 --force
          gh label create auto \
            --description "Auto-managed by GitHub Actions" \
            --color BFD4F2 --force

      - name: Run currency check
        id: check
        env:
          # Fresh ephemeral cache on each run — nothing leaks to the real
          # law_cache volume in prod. The fetcher's --dry-run prevents writes
          # to the JSON law files but still writes currency-report.json.
          LAW_CACHE_DIR: ${{ github.workspace }}/law_cache
        run: |
          python -m ingest.law_fetcher --dry-run
          echo "report_path=${LAW_CACHE_DIR}/currency-report.json" >> "$GITHUB_OUTPUT"

      - name: Upload currency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currency-report
          path: ${{ steps.check.outputs.report_path }}
          if-no-files-found: warn

      - name: Open or update issues for outdated laws
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.check.outputs.report_path }}';
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            // Fetcher emits these status values (see ingest/law_fetcher.py):
            //   up-to-date | new | updated | fetch-failed
            // "new" and "updated" both mean the cache would have changed —
            // i.e. drift from what we have ingested. Treat them identically.
            const drift = report.sources.filter(
              s => s.status === 'new' || s.status === 'updated'
            );
            const failed = report.sources.filter(s => s.status === 'fetch-failed');
            const upToDate = report.sources.filter(s => s.status === 'up-to-date');

            core.summary
              .addHeading('Law currency check', 2)
              .addRaw(`Checked at \`${report.checked_at}\` against \`${report.base_url}\`.`)
              .addList([
                `up-to-date: ${upToDate.length}`,
                `drifted (new/updated): ${drift.length}`,
                `fetch-failed: ${failed.length}`,
              ]);
            if (drift.length) {
              core.summary.addHeading('Drifted laws', 3).addTable([
                [{data: 'law_code', header: true}, {data: 'our', header: true}, {data: 'latest', header: true}, {data: 'status', header: true}],
                ...drift.map(s => [s.law_code, String(s.our_version), String(s.latest_version), s.status]),
              ]);
            }
            await core.summary.write();

            const labels = ['stale-law', 'auto'];

            // Open or update an issue per drifted law.
            for (const src of drift) {
              const title = `Stale law: ${src.law_code} — v${src.our_version} -> v${src.latest_version}`;
              const body = [
                `Detected by automated currency check on \`${report.checked_at}\`.`,
                '',
                `- Our version: \`${src.our_version}\``,
                `- Latest version: \`${src.latest_version}\``,
                `- Fetcher status: \`${src.status}\``,
                '',
                'Action: run `make fetch-laws` then re-ingest. This issue closes',
                'automatically on the next run that reports the law as up-to-date.',
              ].join('\n');

              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labels.join(','),
                per_page: 100,
              });

              const match = existing.data.find(
                i => i.title.startsWith(`Stale law: ${src.law_code} `) ||
                     i.title === `Stale law: ${src.law_code}`
              );
              if (match) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: match.number,
                  title,
                  body,
                });
                core.info(`Updated #${match.number} for ${src.law_code}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels,
                });
                core.info(`Opened #${created.data.number} for ${src.law_code}`);
              }
            }

            // Auto-close issues for laws now back to up-to-date.
            const allOpen = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 100,
            });
            for (const issue of allOpen.data) {
              const m = issue.title.match(/^Stale law:\s+([A-Za-z0-9_-]+)/);
              const lawCode = m && m[1];
              if (!lawCode) continue;
              if (upToDate.some(s => s.law_code === lawCode)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Auto-closed: \`${lawCode}\` is now up-to-date as of ${report.checked_at}.`,
                });
                core.info(`Closed #${issue.number} for ${lawCode}`);
              }
            }
