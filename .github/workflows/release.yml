# Release publish (Issue #35).
#
# Triggered by a human pushing a v*.*.* tag to main. Verifies the tag matches
# the VERSION file, builds and pushes 3 GHCR images (api, ingest, frontend)
# at the version + :latest, then creates a GitHub Release with the matching
# CHANGELOG section as the body.
#
# Required secret: GHCR_TOKEN (PAT with write:packages scope).
#
# Documentation: docs/github-workflows.md
# Runbook:       docs/release-process.md
# Decision:      docs/decisions/ADR-006-tag-driven-release.md

name: Release publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for creating GitHub Releases
      packages: write   # for pushing to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build images
        run: make prod-build

      - name: Push versioned images
        run: make prod-push

      - name: Tag and push :latest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for svc in api ingest frontend; do
            docker tag "ghcr.io/thuusom/danish-legal-rag-$svc:$VERSION" \
                       "ghcr.io/thuusom/danish-legal-rag-$svc:latest"
            docker push "ghcr.io/thuusom/danish-legal-rag-$svc:latest"
          done

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Grab from "## [X.Y.Z]" to the next "## [" line
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          echo "notes_path=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.notes_path }}"
