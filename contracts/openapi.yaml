openapi: 3.1.0
info:
  title: Danish Legal RAG API
  version: 1.0.0
  description: |
    Retrieval-Augmented Generation API for Danish tax and accounting law.

    This file is the contract between backend and frontend. Backend agent
    owns and updates it. Frontend agent generates a typed client from it
    via `make client`.

    Regenerate from the running API with `make contract`.

servers:
  - url: http://localhost:8000
    description: Local dev

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  qdrant: { type: string, example: connected }
                  collections:
                    type: array
                    items: { type: string }

  /ask:
    post:
      summary: Ask a legal question (non-streaming)
      description: |
        Submits a natural-language question in Danish. Retrieves relevant
        legal provisions from Qdrant and returns an LLM-generated answer
        with structured references. Full response returned in one payload.

        For streaming, use `/ask/stream`.
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              software_depreciation:
                summary: Typical question about software depreciation
                value:
                  question: "Hvordan afskrives immaterielle aktiver såsom software skattemæssigt?"
                  limit: 8
      responses:
        '200':
          description: Answer with references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'

  /search:
    post:
      summary: Semantic search without answer generation
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked list of matching legal provisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /ask/stream:
    post:
      summary: Ask a legal question (streaming SSE)
      description: |
        Submits a natural-language question in Danish. Retrieves relevant
        legal provisions from Qdrant and streams the LLM-generated answer
        token-by-token via Server-Sent Events.

        SSE event sequence:
        1. Zero or more `StreamChunkEvent` — partial answer text
        2. One `StreamReferencesEvent` — full reference array
        3. One `StreamDoneEvent` — completion signal with model name

        On error at any point, a single `StreamErrorEvent` is sent and the
        stream closes.

        Each SSE message is formatted as `data: {json}\n\n`.
      operationId: askStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamAskRequest'
            examples:
              software_depreciation:
                summary: Streaming question about software depreciation
                value:
                  question: "Hvordan afskrives immaterielle aktiver såsom software skattemæssigt?"
                  limit: 8
              with_history:
                summary: Follow-up question with conversation history
                value:
                  question: "Hvad med goodwill?"
                  limit: 8
                  history:
                    - role: user
                      content: "Hvordan afskrives software?"
                    - role: assistant
                      content: "Software kan straksafskrives jf. AFL § 41..."
      responses:
        '200':
          description: SSE stream of answer chunks, references, and completion signal
          content:
            text/event-stream:
              schema:
                description: |
                  Newline-delimited SSE events. Each `data:` line contains
                  a JSON object matching one of the event schemas below.
                oneOf:
                  - $ref: '#/components/schemas/StreamChunkEvent'
                  - $ref: '#/components/schemas/StreamReferencesEvent'
                  - $ref: '#/components/schemas/StreamDoneEvent'
                  - $ref: '#/components/schemas/StreamErrorEvent'

  /laws:
    get:
      summary: List all ingested laws
      operationId: listLaws
      responses:
        '200':
          description: Laws in the corpus
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  laws:
                    type: array
                    items:
                      $ref: '#/components/schemas/LawSummary'

  /admin/status:
    get:
      tags: [admin]
      summary: Operator-facing corpus state aggregate
      description: |
        Aggregates the current state of the corpus from three sources:

        * `ingest/sources.yaml` — the declarative manifest of every law we
          intend to ingest.
        * `law_cache/currency-report.json` — written by the live fetcher
          (Issue #20) on every run; reports which laws were checked, the
          latest version observed upstream, and any fetch failures.
        * Qdrant — aggregate per-`law_code` payload metadata (most recent
          `ingested_at`, `law_version_*`, `eli`, provisions count).

        Per-law `status` is computed:
          * `ok` — our ingested version equals the latest upstream version.
          * `outdated` — upstream is newer than what's in Qdrant.
          * `fetch-failed` — last fetcher run errored on this law.
          * `unknown` — no entry in the currency report yet (fetcher hasn't
            run, or has been wiped).

        No authentication. The endpoint is intended for the admin UI
        (Issue #26) and ops tooling; deployment isolation (private network /
        ingress filter) is the gating mechanism for now. Adding auth is a
        follow-up ticket.
      operationId: adminStatus
      responses:
        '200':
          description: Aggregate corpus state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatusResponse'

  /admin/check-currency:
    post:
      tags: [admin]
      summary: Trigger an ad-hoc fetcher run
      description: |
        Spawns the live retsinformation-api.dk fetcher (`ingest.law_fetcher`)
        as a background subprocess. Returns immediately with `202 Accepted`;
        the run takes up to a few minutes depending on rate-limit budget and
        how many laws need updating.

        Idempotent: while a fetcher run is already in progress, returns
        `409 Conflict`. Progress and outcome are observable via
        `GET /admin/status` (the per-law `status` and `last_currency_check`
        update once the run completes and `currency-report.json` is written).

        Body is empty — no per-call configuration. Configuration lives in
        env vars (`FETCHER_RATE_LIMIT_HOUR`, `FETCHER_RATE_LIMIT_DAY`,
        `RETSINFORMATION_API_URL`). To restrict to one law, use the CLI.

        No authentication; same private-network rationale as `/admin/status`.
      operationId: adminCheckCurrency
      responses:
        '202':
          description: Fetcher started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckCurrencyAccepted'
        '409':
          description: Another fetcher run is already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckCurrencyConflict'

components:
  schemas:
    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: Natural language question in Danish
          example: "Hvordan afskrives software skattemæssigt?"
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        filter_law:
          type: string
          nullable: true
          description: Optional law_code filter (e.g. AFL, ARL)
        retrieval_strategy:
          type: string
          enum: [dense, hybrid]
          nullable: true
          description: |
            Retrieval strategy to use. If omitted, the server picks the
            default (currently "dense"). "hybrid" enables combined dense
            + sparse BM25 retrieval with RRF fusion.

    AskResponse:
      type: object
      required: [answer, references, retrieved_context, question, model_used]
      properties:
        answer:
          type: string
          description: LLM-generated answer in Danish, grounded in references
        references:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'
        retrieved_context:
          type: array
          description: |
            Raw retrieved Qdrant payloads (for debugging/transparency). Each
            entry is a `LegalChunk` payload as stored in the vector index.
          items:
            $ref: '#/components/schemas/LegalChunk'
        question:
          type: string
        model_used:
          type: string
          example: "claude-opus-4-5"

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
        filter_law: { type: string, nullable: true }
        retrieval_strategy:
          type: string
          enum: [dense, hybrid]
          nullable: true
          description: |
            Retrieval strategy to use. If omitted, the server picks the
            default (currently "dense"). "hybrid" enables combined dense
            + sparse BM25 retrieval with RRF fusion.

    SearchResponse:
      type: object
      required: [results, query]
      properties:
        query: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'

    LegalReference:
      type: object
      required: [law, law_code, section, quote, citation_label]
      properties:
        law: { type: string, description: "Human-readable law name" }
        law_code: { type: string, example: "AFL" }
        section: { type: string, example: "§ 40 C" }
        subsection: { type: string, nullable: true, example: "stk. 1" }
        item: { type: string, nullable: true }
        title: { type: string, nullable: true }
        quote:
          type: string
          description: The cited legal provision text
        citation_label:
          type: string
          example: "Afskrivningsloven § 40 C, stk. 1"
        source_url:
          type: string
          nullable: true
          format: uri
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        eli:
          type: string
          nullable: true
          description: |
            European Legislation Identifier path for the law this reference
            comes from, e.g. `eli/lta/2016/1147`. Lets clients deep-link to
            the official source on retsinformation.dk.
          example: "eli/lta/2016/1147"
        law_version_date:
          type: string
          format: date
          nullable: true
          description: |
            Effective date of the law version this reference was retrieved
            from. Allows the UI to surface "the cited text is from version
            of YYYY-MM-DD" so users can judge currency.
          example: "2016-09-06"

    StreamAskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: Natural language question in Danish
          example: "Hvordan afskrives software skattemæssigt?"
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        filter_law:
          type: string
          nullable: true
          description: Optional law_code filter (e.g. AFL, ARL)
        retrieval_strategy:
          type: string
          enum: [dense, hybrid]
          nullable: true
          description: |
            Retrieval strategy to use. If omitted, the server picks the
            default (currently "dense"). "hybrid" enables combined dense
            + sparse BM25 retrieval with RRF fusion.
        history:
          type: array
          nullable: true
          description: |
            Optional conversation history for multi-turn context.
            Messages are prepended to the LLM context in order.
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string

    StreamChunkEvent:
      type: object
      required: [type, data]
      description: Partial answer text chunk, streamed as the LLM generates tokens.
      properties:
        type:
          type: string
          enum: [chunk]
        data:
          type: string
          description: A fragment of the answer text
      example:
        type: chunk
        data: "Ifølge Afskrivningsloven"

    StreamReferencesEvent:
      type: object
      required: [type, data]
      description: Full array of legal references, sent once after the answer is complete.
      properties:
        type:
          type: string
          enum: [references]
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'
      example:
        type: references
        data:
          - law: Afskrivningsloven
            law_code: AFL
            section: "§ 41"
            quote: "Udgifter til anskaffelse af..."
            citation_label: "Afskrivningsloven § 41"

    StreamDoneEvent:
      type: object
      required: [type, data]
      description: Completion signal, sent as the final event.
      properties:
        type:
          type: string
          enum: [done]
        data:
          type: object
          required: [model_used]
          properties:
            model_used:
              type: string
              example: "claude-opus-4-5"

    StreamErrorEvent:
      type: object
      required: [type, data]
      description: Error event. Sent on failure, after which the stream closes.
      properties:
        type:
          type: string
          enum: [error]
        data:
          type: object
          required: [detail]
          properties:
            detail:
              type: string
              description: Human-readable error message

    LawSummary:
      type: object
      required: [law_code, law_name]
      properties:
        law_code: { type: string }
        law_name: { type: string }
        law_title: { type: string, nullable: true }
        law_number: { type: string, nullable: true }
        source_url: { type: string, nullable: true, format: uri }
        eli:
          type: string
          nullable: true
          description: |
            European Legislation Identifier path, e.g. `eli/lta/2016/1147`.
            Aggregated across the law's chunks (first non-null wins).
          example: "eli/lta/2016/1147"
        law_version_date:
          type: string
          format: date
          nullable: true
          description: |
            Effective date of the law version currently ingested.
            Aggregated across the law's chunks (first non-null wins).
          example: "2016-09-06"
        latest_ingested_at:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC timestamp of the most recent ingestion across this law's chunks.
            Lets the UI display "last updated YYYY-MM-DD HH:MM".
          example: "2026-04-27T08:30:00Z"

    LegalChunk:
      type: object
      description: |
        Full Qdrant payload for a single legal provision chunk. Returned
        verbatim in the `retrieved_context` array of `/ask` responses.
        All metadata fields beyond the core legal reference are optional —
        chunks ingested before live-fetcher support left them null.
      required: [id, law_code, law_name, law_title, section, text, citation_label, embedding_model, embedding_content_hash]
      properties:
        id: { type: string }
        law_code: { type: string, example: "AFL" }
        law_name: { type: string, example: "Afskrivningsloven" }
        law_title: { type: string }
        chapter: { type: string, nullable: true }
        section: { type: string, example: "§ 40 C" }
        subsection: { type: string, nullable: true }
        item: { type: string, nullable: true }
        title: { type: string, nullable: true }
        text: { type: string }
        citation_label: { type: string }
        source_url: { type: string, nullable: true, format: uri }
        effective_date: { type: string, nullable: true }
        law_number: { type: string, nullable: true }
        embedding_model: { type: string }
        embedding_content_hash: { type: string, description: "SHA256 of embedding input text" }
        ingested_at:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC timestamp at which this chunk was ingested. Set automatically
            by the ingestion pipeline. Optional because chunks ingested
            before this field existed will not have it on first read.
        law_version_date:
          type: string
          format: date
          nullable: true
          description: |
            Effective date of the law version this chunk was extracted from
            (sourced from the retsinformation API `effective_date` top-level
            field). Lets us distinguish chunks belonging to different
            versions of the same law in the index.
        law_version_number:
          type: integer
          nullable: true
          description: |
            Version number of the law as reported by the retsinformation API
            (`version_number`). Useful diagnostic when a re-ingestion brings
            in a newer version.
        eli:
          type: string
          nullable: true
          description: |
            European Legislation Identifier path, e.g. `eli/lta/2016/1147`.
            Stable canonical reference, useful for citations and dedup.
        retsinformation_law_id:
          type: string
          nullable: true
          description: |
            UUID identifying the law (stable across versions) in the
            retsinformation-api.dk store. Lets us query for updates without
            hardcoding (year, number).
          example: "7f6afaff-1234-5678-9abc-def012345678"
        retsinformation_paragraph_id:
          type: string
          nullable: true
          description: |
            Stable paragraph anchor id used by retsinformation.dk's HTML
            viewer (e.g. `id39cb96dc-...`). Lets us deep-link to the §-level.

    AdminLawStatus:
      type: object
      description: |
        Per-law row for the admin status response. Combines manifest data
        (`law_code`, `law_name`, `law_title`), Qdrant aggregates (`our_version`,
        `our_version_number`, `our_version_date`, `eli`, `ingested_at`,
        `provisions_count`), and the latest currency-report entry
        (`latest_version_number`, `latest_version_date`, `status`,
        `fetch_error`).
      required: [law_code, law_name, status]
      properties:
        law_code: { type: string, example: "AFL" }
        law_name: { type: string, example: "Afskrivningsloven" }
        law_title:
          type: string
          nullable: true
          example: "Bekendtgørelse af lov om skattemæssige afskrivninger (afskrivningsloven)"
        our_version:
          type: string
          nullable: true
          description: |
            Human-readable identifier of the ingested version (typically the
            `law_number` field, e.g. `LBK nr 1147 af 29/08/2016`).
          example: "LBK nr 1147 af 29/08/2016"
        our_version_number:
          type: integer
          nullable: true
          description: |
            Numeric version reported by the retsinformation API for the
            currently ingested cache file. Null until the live fetcher has
            run for this law.
          example: 1
        our_version_date:
          type: string
          format: date
          nullable: true
          description: Effective date of the ingested law version.
          example: "2016-08-29"
        latest_version_number:
          type: integer
          nullable: true
          description: |
            Numeric version of the latest law version observed upstream.
            Null until the fetcher has run.
          example: 24
        latest_version_date:
          type: string
          format: date
          nullable: true
          description: Effective date of the latest version upstream.
          example: "2021-01-01"
        status:
          type: string
          enum: [ok, outdated, fetch-failed, unknown]
          description: |
            Aggregate health for this law. See endpoint description.
        ingested_at:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp of the most recent ingestion for this law.
          example: "2026-04-27T10:00:00Z"
        provisions_count:
          type: integer
          description: Number of chunks currently in Qdrant for this law.
          example: 41
        eli:
          type: string
          nullable: true
          example: "eli/lta/2016/1147"
        fetch_error:
          type: string
          nullable: true
          description: Last fetch error message, if `status == "fetch-failed"`.

    AdminFetcherState:
      type: object
      description: Rate-limit snapshot from the fetcher's persistent state.
      required: [calls_today, rate_limit_day, calls_this_hour, rate_limit_hour]
      properties:
        calls_today:
          type: integer
          description: |
            Calls consumed today (UTC). Resets at midnight UTC. Reflects the
            persisted counter in `law_cache/.fetcher_state.json`.
          example: 12
        rate_limit_day:
          type: integer
          description: Daily call budget enforced by the fetcher.
          example: 40
        calls_this_hour:
          type: integer
          description: |
            Calls consumed in the last hour. Best-effort — only the daily
            counter is persisted, so this is reset on container restart.
          example: 3
        rate_limit_hour:
          type: integer
          description: Hourly call budget enforced by the fetcher.
          example: 15

    AdminStatusResponse:
      type: object
      required: [laws, ingestion_status, fetcher_state]
      properties:
        laws:
          type: array
          items:
            $ref: '#/components/schemas/AdminLawStatus'
        last_currency_check:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC timestamp of the last fetcher run. Null when the fetcher has
            never run (no `currency-report.json` yet).
          example: "2026-04-27T06:00:00Z"
        ingestion_status:
          type: string
          enum: [idle, running, failed, unknown]
          description: |
            Current state of the ingestion job. `running` is set while the
            ingest job is executing; `idle` after a successful run; `failed`
            after a crash; `unknown` if no state file exists yet.
        last_ingestion_completed:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC timestamp of the last successful ingestion (when
            `ingestion_status` transitioned from `running` to `idle`).
          example: "2026-04-27T10:05:00Z"
        last_ingestion_error:
          type: string
          nullable: true
          description: |
            Error message from the last failed ingestion run, if
            `ingestion_status == "failed"`.
        fetcher_state:
          $ref: '#/components/schemas/AdminFetcherState'

    AdminCheckCurrencyAccepted:
      type: object
      required: [status, started_at]
      properties:
        status:
          type: string
          enum: [started]
        started_at:
          type: string
          format: date-time
          example: "2026-04-27T10:00:00Z"

    AdminCheckCurrencyConflict:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [already-running]
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the in-progress run started, if known.
