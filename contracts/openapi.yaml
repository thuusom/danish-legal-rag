openapi: 3.1.0
info:
  title: Danish Legal RAG API
  version: 1.0.0
  description: |
    Retrieval-Augmented Generation API for Danish tax and accounting law.

    This file is the contract between backend and frontend. Backend agent
    owns and updates it. Frontend agent generates a typed client from it
    via `make client`.

    Regenerate from the running API with `make contract`.

servers:
  - url: http://localhost:8000
    description: Local dev

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  qdrant: { type: string, example: connected }
                  collections:
                    type: array
                    items: { type: string }

  /ask:
    post:
      summary: Ask a legal question (non-streaming)
      description: |
        Submits a natural-language question in Danish. Retrieves relevant
        legal provisions from Qdrant and returns an LLM-generated answer
        with structured references. Full response returned in one payload.

        For streaming, use `/ask/stream`.
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              software_depreciation:
                summary: Typical question about software depreciation
                value:
                  question: "Hvordan afskrives immaterielle aktiver såsom software skattemæssigt?"
                  limit: 8
      responses:
        '200':
          description: Answer with references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'

  /search:
    post:
      summary: Semantic search without answer generation
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked list of matching legal provisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /ask/stream:
    post:
      summary: Ask a legal question (streaming SSE)
      description: |
        Submits a natural-language question in Danish. Retrieves relevant
        legal provisions from Qdrant and streams the LLM-generated answer
        token-by-token via Server-Sent Events.

        SSE event sequence:
        1. Zero or more `StreamChunkEvent` — partial answer text
        2. One `StreamReferencesEvent` — full reference array
        3. One `StreamDoneEvent` — completion signal with model name

        On error at any point, a single `StreamErrorEvent` is sent and the
        stream closes.

        Each SSE message is formatted as `data: {json}\n\n`.
      operationId: askStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamAskRequest'
            examples:
              software_depreciation:
                summary: Streaming question about software depreciation
                value:
                  question: "Hvordan afskrives immaterielle aktiver såsom software skattemæssigt?"
                  limit: 8
              with_history:
                summary: Follow-up question with conversation history
                value:
                  question: "Hvad med goodwill?"
                  limit: 8
                  history:
                    - role: user
                      content: "Hvordan afskrives software?"
                    - role: assistant
                      content: "Software kan straksafskrives jf. AFL § 41..."
      responses:
        '200':
          description: SSE stream of answer chunks, references, and completion signal
          content:
            text/event-stream:
              schema:
                description: |
                  Newline-delimited SSE events. Each `data:` line contains
                  a JSON object matching one of the event schemas below.
                oneOf:
                  - $ref: '#/components/schemas/StreamChunkEvent'
                  - $ref: '#/components/schemas/StreamReferencesEvent'
                  - $ref: '#/components/schemas/StreamDoneEvent'
                  - $ref: '#/components/schemas/StreamErrorEvent'

  /laws:
    get:
      summary: List all ingested laws
      operationId: listLaws
      responses:
        '200':
          description: Laws in the corpus
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  laws:
                    type: array
                    items:
                      $ref: '#/components/schemas/LawSummary'

components:
  schemas:
    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: Natural language question in Danish
          example: "Hvordan afskrives software skattemæssigt?"
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        filter_law:
          type: string
          nullable: true
          description: Optional law_code filter (e.g. AFL, ARL)
        retrieval_strategy:
          type: string
          enum: [dense, hybrid]
          nullable: true
          description: |
            Retrieval strategy to use. If omitted, the server picks the
            default (currently "dense"). "hybrid" enables combined dense
            + sparse BM25 retrieval with RRF fusion.

    AskResponse:
      type: object
      required: [answer, references, retrieved_context, question, model_used]
      properties:
        answer:
          type: string
          description: LLM-generated answer in Danish, grounded in references
        references:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'
        retrieved_context:
          type: array
          description: |
            Raw retrieved Qdrant payloads (for debugging/transparency). Each
            entry is a `LegalChunk` payload as stored in the vector index.
          items:
            $ref: '#/components/schemas/LegalChunk'
        question:
          type: string
        model_used:
          type: string
          example: "claude-opus-4-5"

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
        filter_law: { type: string, nullable: true }
        retrieval_strategy:
          type: string
          enum: [dense, hybrid]
          nullable: true
          description: |
            Retrieval strategy to use. If omitted, the server picks the
            default (currently "dense"). "hybrid" enables combined dense
            + sparse BM25 retrieval with RRF fusion.

    SearchResponse:
      type: object
      required: [results, query]
      properties:
        query: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'

    LegalReference:
      type: object
      required: [law, law_code, section, quote, citation_label]
      properties:
        law: { type: string, description: "Human-readable law name" }
        law_code: { type: string, example: "AFL" }
        section: { type: string, example: "§ 40 C" }
        subsection: { type: string, nullable: true, example: "stk. 1" }
        item: { type: string, nullable: true }
        title: { type: string, nullable: true }
        quote:
          type: string
          description: The cited legal provision text
        citation_label:
          type: string
          example: "Afskrivningsloven § 40 C, stk. 1"
        source_url:
          type: string
          nullable: true
          format: uri
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        eli:
          type: string
          nullable: true
          description: |
            European Legislation Identifier path for the law this reference
            comes from, e.g. `eli/lta/2016/1147`. Lets clients deep-link to
            the official source on retsinformation.dk.
          example: "eli/lta/2016/1147"
        law_version_date:
          type: string
          format: date
          nullable: true
          description: |
            Effective date of the law version this reference was retrieved
            from. Allows the UI to surface "the cited text is from version
            of YYYY-MM-DD" so users can judge currency.
          example: "2016-09-06"

    StreamAskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: Natural language question in Danish
          example: "Hvordan afskrives software skattemæssigt?"
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        filter_law:
          type: string
          nullable: true
          description: Optional law_code filter (e.g. AFL, ARL)
        retrieval_strategy:
          type: string
          enum: [dense, hybrid]
          nullable: true
          description: |
            Retrieval strategy to use. If omitted, the server picks the
            default (currently "dense"). "hybrid" enables combined dense
            + sparse BM25 retrieval with RRF fusion.
        history:
          type: array
          nullable: true
          description: |
            Optional conversation history for multi-turn context.
            Messages are prepended to the LLM context in order.
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string

    StreamChunkEvent:
      type: object
      required: [type, data]
      description: Partial answer text chunk, streamed as the LLM generates tokens.
      properties:
        type:
          type: string
          enum: [chunk]
        data:
          type: string
          description: A fragment of the answer text
      example:
        type: chunk
        data: "Ifølge Afskrivningsloven"

    StreamReferencesEvent:
      type: object
      required: [type, data]
      description: Full array of legal references, sent once after the answer is complete.
      properties:
        type:
          type: string
          enum: [references]
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalReference'
      example:
        type: references
        data:
          - law: Afskrivningsloven
            law_code: AFL
            section: "§ 41"
            quote: "Udgifter til anskaffelse af..."
            citation_label: "Afskrivningsloven § 41"

    StreamDoneEvent:
      type: object
      required: [type, data]
      description: Completion signal, sent as the final event.
      properties:
        type:
          type: string
          enum: [done]
        data:
          type: object
          required: [model_used]
          properties:
            model_used:
              type: string
              example: "claude-opus-4-5"

    StreamErrorEvent:
      type: object
      required: [type, data]
      description: Error event. Sent on failure, after which the stream closes.
      properties:
        type:
          type: string
          enum: [error]
        data:
          type: object
          required: [detail]
          properties:
            detail:
              type: string
              description: Human-readable error message

    LawSummary:
      type: object
      required: [law_code, law_name]
      properties:
        law_code: { type: string }
        law_name: { type: string }
        law_title: { type: string, nullable: true }
        law_number: { type: string, nullable: true }
        source_url: { type: string, nullable: true, format: uri }
        eli:
          type: string
          nullable: true
          description: |
            European Legislation Identifier path, e.g. `eli/lta/2016/1147`.
            Aggregated across the law's chunks (first non-null wins).
          example: "eli/lta/2016/1147"
        law_version_date:
          type: string
          format: date
          nullable: true
          description: |
            Effective date of the law version currently ingested.
            Aggregated across the law's chunks (first non-null wins).
          example: "2016-09-06"
        latest_ingested_at:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC timestamp of the most recent ingestion across this law's chunks.
            Lets the UI display "last updated YYYY-MM-DD HH:MM".
          example: "2026-04-27T08:30:00Z"

    LegalChunk:
      type: object
      description: |
        Full Qdrant payload for a single legal provision chunk. Returned
        verbatim in the `retrieved_context` array of `/ask` responses.
        All metadata fields beyond the core legal reference are optional —
        chunks ingested before live-fetcher support left them null.
      required: [id, law_code, law_name, law_title, section, text, citation_label, embedding_model, embedding_content_hash]
      properties:
        id: { type: string }
        law_code: { type: string, example: "AFL" }
        law_name: { type: string, example: "Afskrivningsloven" }
        law_title: { type: string }
        chapter: { type: string, nullable: true }
        section: { type: string, example: "§ 40 C" }
        subsection: { type: string, nullable: true }
        item: { type: string, nullable: true }
        title: { type: string, nullable: true }
        text: { type: string }
        citation_label: { type: string }
        source_url: { type: string, nullable: true, format: uri }
        effective_date: { type: string, nullable: true }
        law_number: { type: string, nullable: true }
        embedding_model: { type: string }
        embedding_content_hash: { type: string, description: "SHA256 of embedding input text" }
        ingested_at:
          type: string
          format: date-time
          nullable: true
          description: |
            UTC timestamp at which this chunk was ingested. Set automatically
            by the ingestion pipeline. Optional because chunks ingested
            before this field existed will not have it on first read.
        law_version_date:
          type: string
          format: date
          nullable: true
          description: |
            Effective date of the law version this chunk was extracted from
            (sourced from the retsinformation API `effective_date` top-level
            field). Lets us distinguish chunks belonging to different
            versions of the same law in the index.
        law_version_number:
          type: integer
          nullable: true
          description: |
            Version number of the law as reported by the retsinformation API
            (`version_number`). Useful diagnostic when a re-ingestion brings
            in a newer version.
        eli:
          type: string
          nullable: true
          description: |
            European Legislation Identifier path, e.g. `eli/lta/2016/1147`.
            Stable canonical reference, useful for citations and dedup.
        retsinformation_law_id:
          type: string
          nullable: true
          description: |
            UUID identifying the law (stable across versions) in the
            retsinformation-api.dk store. Lets us query for updates without
            hardcoding (year, number).
          example: "7f6afaff-1234-5678-9abc-def012345678"
        retsinformation_paragraph_id:
          type: string
          nullable: true
          description: |
            Stable paragraph anchor id used by retsinformation.dk's HTML
            viewer (e.g. `id39cb96dc-...`). Lets us deep-link to the §-level.
