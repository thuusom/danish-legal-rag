# Danish Legal RAG — source manifest.
#
# Single declarative manifest of every law/bekendtgørelse the system ingests.
# Adding or removing a source is a one-line change here; ingestion picks it up.
#
# Each entry contains:
#   law_code:                short code stamped on every chunk (must match LegalChunk.law_code)
#   title:                   official title of the consolidation act
#   short_name:              popular Danish name used in citations
#   retsinformation.year:    year component used by the retsinformation-api.dk fetcher (#20)
#   retsinformation.number:  document number (LBK/LOV/BEK) for that year
#   seed_file:               in-repo JSON used to seed the cache on first boot
#                            (relative to the repo root)
#
# The (year, number) pair is derived from the existing `law_number` field
# in each seed file, e.g. "LBK nr 1147 af 29/08/2016" -> 2016 / 1147.
#
# This manifest is consumed by ingest/cache.py (seed_cache_from_repo) and,
# eventually, the live retsinformation fetcher (#20).

sources:
  # ─── Love (Acts) ───────────────────────────────────────────────────────
  - law_code: AFL
    title: Bekendtgørelse af lov om skattemæssige afskrivninger
    short_name: Afskrivningsloven
    retsinformation:
      year: 2016
      number: 1147
    seed_file: ingest/data/afskrivningsloven.json

