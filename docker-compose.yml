services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: danish-legal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No Docker health check: the qdrant image is a minimal Debian slim binary
    # with no curl/wget/bash available. Readiness is handled by the retry loops
    # in wait_for_qdrant() (ingest) and wait_for_qdrant_api() (api).
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: danish-legal-ingest
    # env_file reads .env directly (bypasses shell env overrides)
    env_file:
      - .env
    environment:
      # These override .env for service-internal networking
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: danish-legal-api
    ports:
      - "8000:8000"
    # env_file reads .env directly (bypasses shell env overrides)
    env_file:
      - .env
    environment:
      # These override .env for service-internal networking
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      # Mount answer-style.md so edits take effect without rebuilding the image.
      # Delete or leave empty to use the version baked into the image.
      - ./answer-style.md:/app/answer-style.md:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: danish-legal-mcp
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  qdrant_data:
