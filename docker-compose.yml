services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: danish-legal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No Docker health check: the qdrant image is a minimal Debian slim binary
    # with no curl/wget/bash available. Readiness is handled by the retry loops
    # in wait_for_qdrant() (ingest) and wait_for_qdrant_api() (api).
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: danish-legal-ingest
    # env_file reads .env directly (bypasses shell env overrides)
    env_file:
      - .env
    environment:
      # These override .env for service-internal networking
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Point HuggingFace to the shared cache volume so the embedding model
      # is only downloaded once (shared with the api service).
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface/hub
    volumes:
      # Shared model cache – avoids re-downloading ~440 MB on every restart.
      - hf_model_cache:/cache/huggingface
    depends_on:
      - qdrant
    # restart: "no" – ingest is a one-shot job.
    # It runs to completion, writes chunks+vectors to Qdrant, then exits.
    # This is intentional: Qdrant persists all data in qdrant_data volume,
    # so there is nothing to keep running. Re-run manually with:
    #   docker compose run --rm ingest
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: danish-legal-api
    ports:
      - "8000:8000"
    # env_file reads .env directly (bypasses shell env overrides)
    env_file:
      - .env
    environment:
      # These override .env for service-internal networking
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Point HuggingFace to the shared cache volume.
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface/hub
    volumes:
      # Same shared model cache as ingest – model downloaded only once total.
      - hf_model_cache:/cache/huggingface
      # Mount answer-style.md so tone/style edits take effect without rebuilding.
      # Edit the file freely; changes are picked up on the next API call.
      - ./answer-style.md:/app/answer-style.md:ro
    depends_on:
      - qdrant
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: danish-legal-mcp
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  qdrant_data:
    # Qdrant vector store – persists all ingested chunks and their embeddings.
  hf_model_cache:
    # HuggingFace model cache – the ~440 MB embedding model is downloaded here
    # on first run and reused across restarts and rebuilds by both ingest and api.
